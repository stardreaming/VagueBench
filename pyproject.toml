[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vaguebench"
version = "0.1.0"
description = "Paired clear and vague instruction evaluation in ALFRED"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
eval = [
    "numpy==1.23.5", "gym==0.23.0", "ai2thor==2.1.0", "Pillow==11.0.0",
    "scipy==1.13.1", "networkx==3.2.1", "opencv-python==4.10.0.84",
    "openai==1.60.0", "requests", "httpx==0.27.0",
    # AI2-THOR 2.1.0 uses the historical Werkzeug server interface.
    "Flask==1.1.2", "Werkzeug==1.0.1", "Jinja2==2.11.3",
    "MarkupSafe==1.1.1", "itsdangerous==1.1.0",
]
anthropic = ["anthropic==0.43.0"]
local = ["lmdeploy==0.6.3"]

[project.scripts]
vaguebench = "vaguebench.main:main"

[tool.setuptools.packages.find]
include = ["vaguebench*"]

[tool.setuptools.package-data]
vaguebench = ["data/dataset.json", "prompts/*.json", "envs/eb_alfred/LICENSE", "envs/eb_alfred/models/config/*.json", "envs/eb_alfred/gen/layouts/*.npy"]
